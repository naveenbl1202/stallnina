backend:
  name: git-gateway
  branch: main
publish_mode: editorial_workflow
media_folder: "images/uploads"
public_folder: "/images/uploads"
collections:
  - name: "horses"
    label: "Hästar"
    folder: "src/horses"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Bild", name: "image", widget: "image" }
      - { label: "Beskrivning", name: "description", widget: "text" }
      - { label: "Video (YouTube Embed URL)", name: "video", widget: "string", required: false }
  - name: "gallery"
    label: "Galleri"
    folder: "src/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Bild", name: "image", widget: "image" }
  - name: "news"
    label: "Nyheter"
    folder: "src/news"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime" }
      - { label: "Innehåll", name: "content", widget: "markdown" }
      - { label: "Bild", name: "image", widget: "image", required: false }